fidelity:
  divergences: >-
    The deterministic context-free level is stated through its LR-grammar
    presentation; its equivalence with deterministic pushdown recognition is a
    separate submission. Recursive languages retain the always-halting Mathlib
    TM0 definition. Every strictness theorem records a sufficient lower bound
    on the number of terminal symbols and applies to every finite alphabet
    meeting that bound; no strictness claim is made below it. Indexed languages
    are grammar-defined because nested-stack automata are not formalized.
    Novelty has not been established and is not claimed.

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI Codex"
  notes: >-
    Submission preparation inventoried the eight selected declarations, checked
    theorem axioms and unresolved holes, and matched the Mathlib-only Challenge
    signatures with the Langlib Solution. The pinned Comparator accepted all
    eight declarations, and both NanoDa and Lean's default kernel accepted the
    exported solution. This is not independent human peer review.

alignment:
  namespace: "ChomskyHierarchy"
  statements:
    - source: "Strict extended Chomsky hierarchy"
      lean: >-
        RG_strict_subclass_Linear_of_card;
        Linear_strict_subclass_CF_of_card;
        RG_strict_subclass_LR_of_card;
        LR_strict_subclass_CF_of_card;
        CF_strict_subclass_Indexed;
        Indexed_strict_subclass_CS;
        CS_strict_subclass_Recursive_of_card;
        Recursive_strict_subclass_RE_of_card
      module: "Langlib.Classes and Langlib.Grammars.LR"
      status: "proved"
      note: >-
        These are strict inclusions over every finite terminal alphabet with at
        least the number of elements stated in Challenge.lean. LR grammars give
        the deterministic context-free level without declaring a machine model
        in this challenge.

