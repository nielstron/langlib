# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Langlib"
  description: >-
    A Lean 4 formalization of grammar and automaton presentations of the
    extended Chomsky hierarchy. Starting from unrestricted-grammar rewriting,
    it defines regular, linear, context-free, context-sensitive, indexed,
    deterministic context-free, recursive, and recursively enumerable language
    classes; relates finite, pushdown, linearly bounded, and Mathlib TM0
    automata to the corresponding grammar classes; proves strict hierarchy
    inclusions; and establishes closure or non-closure under thirteen operations
    for seven major classes.
  authors:
    - "Niels Mündler"
    - "Martin Dvořák"
  license: "BSD-2-Clause"
  responsible_maintainers:
    - "Niels Mündler"

licensing:
  repository_default: "BSD-2-Clause"
  license_file: "LICENSE.md"
  notice_file: "NOTICE.md"
  file_level_exceptions: >-
    Source files carrying an explicit Apache-2.0 header remain under the
    Apache License 2.0. Its text is included at licenses/Apache-2.0.txt.

classification:
  arxiv: ["cs.FL"]
  msc2020: ["68Q42", "68Q45", "68Q04"]

sources:
  - title: "Introduction to Automata Theory, Languages, and Computation, 3rd edition"
    authors:
      - "John E. Hopcroft"
      - "Rajeev Motwani"
      - "Jeffrey D. Ullman"
    id: "ISBN 978-0321455369"
    type: "book"
    location: "Chapters 2-9"
    relationship: "formalizes"
    note: >-
      A standard source for the grammar and automaton models, their principal
      equivalences, hierarchy relations, and many closure results. Langlib
      formalizes these results with the precise encodings and qualifications
      recorded below.
  - title: "Indexed Grammars—An Extension of Context-Free Grammars"
    authors:
      - "Alfred V. Aho"
    id: "doi:10.1145/321479.321488"
    type: "paper"
    location: "Journal of the ACM 15(4), 647-671 (1968)"
    relationship: "formalizes"
    note: >-
      Source for indexed grammars, their placement between context-free and
      context-sensitive languages, and classical closure properties. The Lean
      development includes an explicit bounded LBA simulation based on Aho's
      normal-form construction.
  - title: "Classes of Languages and Linear-Bounded Automata"
    authors:
      - "Sige-Yuki Kuroda"
    id: "doi:10.1016/S0019-9958(64)90120-2"
    type: "paper"
    location: "Information and Control 7(2), 207-223 (1964)"
    relationship: "formalizes"
    note: >-
      Source for the context-sensitive grammar to linear-bounded automaton
      direction and associated normal-form ideas. Langlib formalizes an
      endmarker-machine version with explicit empty-word handling.
  - title: "Linear Bounded Automata"
    authors:
      - "John Myhill"
    id: "WADD Technical Note 60-165"
    type: "other"
    location: "Wright Air Development Division (1960)"
    relationship: "formalizes"
    note: >-
      Source for the linear-bounded automaton to context-sensitive grammar
      direction. Langlib gives a kernel-checked construction for its precise
      endmarker convention.
  - title: "On the Translation of Languages from Left to Right"
    authors:
      - "Donald E. Knuth"
    id: "doi:10.1016/S0019-9958(65)90426-2"
    type: "paper"
    location: "Information and Control 8(6), 607-639 (1965)"
    relationship: "formalizes"
    note: >-
      Source for the semantic LR(k) condition and its relationship with
      deterministic languages. Langlib formalizes the LR/DPDA
      characterization used in the selected theorems.

related_formalizations:
  - id: "https://github.com/madvorak/grammars"
    relationship: "adapts"
    note: >-
      Langlib began as a Lean 4 port of this earlier Lean formalization and has
      since substantially extended and reorganized it.
  - id: "https://github.com/AlexLoitzl/pumping_cfg"
    relationship: "adapts"
    note: >-
      Langlib ports its context-free pumping-lemma proof; pumping results are
      background to parts of the hierarchy development but are not selected in
      this Comparator configuration.
  - id: "https://github.com/shetzl/autth"
    relationship: "adapts"
    note: >-
      The CFG/PDA equivalence development includes a port and adaptation of
      the PDA branch of this earlier Lean work.

status:
  scope: >-
    The selected challenge contains transparent definitions of unrestricted,
    regular, linear, context-free, context-sensitive, LR, indexed, and
    automaton-recognized language classes; grammar/automaton equivalences for
    regular, context-free, deterministic context-free, context-sensitive, and
    recursively enumerable languages; the strict extended Chomsky hierarchy;
    incomparability of the linear and deterministic context-free classes; and a
    13-operation closure/non-closure matrix for regular, deterministic
    context-free, context-free, indexed, context-sensitive, recursive, and
    recursively enumerable languages. Decidability and undecidability results
    in the repository are intentionally excluded. Nested-stack automata and the
    indexed-grammar equivalence are not formalized. Linear languages have no
    automaton characterization here. Only DLBA inclusion in NLBA is proved; the
    reverse inclusion is not claimed. Recursive languages use always-halting
    Mathlib TM0 machines, and no second tape-machine characterization is
    selected as an equivalence.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "RG_eq_DFA"
      file: "src/Langlib/Automata/FiniteState/Equivalence/Regular.lean"
      sorry_count: 0
      comparator_config: "comparator.json"
    - declaration: "CF_eq_PDA_Class"
      file: "src/Langlib/Automata/Pushdown/Equivalence/ContextFree.lean"
      sorry_count: 0
      comparator_config: "comparator.json"
    - declaration: "LR_eq_DCF"
      file: "src/Langlib/Grammars/LR/Equivalence.lean"
      sorry_count: 0
      comparator_config: "comparator.json"
    - declaration: "Linear_incomp_DPDA_of_card"
      file: "src/Langlib/Classes/Linear/Inclusion/DeterministicContextFree.lean"
      sorry_count: 0
      comparator_config: "comparator.json"
    - declaration: "CS_eq_LBA"
      file: "src/Langlib/Automata/LinearBounded/Equivalence/ContextSensitive.lean"
      sorry_count: 0
      comparator_config: "comparator.json"
    - declaration: "TM_eq_RE"
      file: "src/Langlib/Automata/Turing/Equivalence/RecursivelyEnumerable.lean"
      sorry_count: 0
      comparator_config: "comparator.json"
    - declaration: "ChomskyHierarchy.Indexed_strict_subclass_CS"
      file: "Solution.lean"
      sorry_count: 0
      comparator_config: "comparator.json"
    - declaration: "ChomskyHierarchy.CS_strict_subclass_Recursive_of_card"
      file: "Solution.lean"
      sorry_count: 0
      comparator_config: "comparator.json"
    - declaration: "ChomskyHierarchy.Recursive_strict_subclass_RE_of_card"
      file: "Solution.lean"
      sorry_count: 0
      comparator_config: "comparator.json"

