fidelity:
  divergences: >-
    Langlib makes implementation conventions explicit rather than claiming
    literal identity with every cited presentation. Its context-sensitive
    grammar permits the distinguished rule S -> epsilon only when S never
    occurs on a right-hand side; its equivalent LBA uses explicit endmarkers
    and handles the empty word on a genuine two-cell tape. Strict inclusions
    record explicit lower bounds on the number of alphabet elements; no
    strictness claim is made below a theorem's stated bound. A negative closure
    theorem records failure on its stated finite witness alphabet, not failure
    on every alphabet. Indexed
    languages are grammar-defined with no nested-stack automaton model; linear
    languages likewise lack an automaton characterization. DLBA = NLBA is not
    asserted, and the recursive class has no selected second tape-model
    equivalence. These are known scope limits, not inferred equivalences.
    Novelty has not been established and is not claimed.

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI Codex"
  notes: >-
    Submission preparation inventoried every selected declaration, checked
    theorem axioms and unresolved holes, and compared the Challenge signatures
    with Langlib. This is not independent human peer review.

alignment:
  namespace: "Root namespace, with a few theorem families in descriptive namespaces"
  statements:
    - source: "Regular grammars and finite automata"
      lean: "RG_eq_DFA; NFA_eq_DFA"
      module: "Langlib.Automata.FiniteState"
      status: "proved"
      note: >-
        Right-regular unrestricted grammars, Mathlib regular languages, and
        finite DFA/NFA recognizers define the same language class.
    - source: "Context-free grammars and pushdown automata"
      lean: "CF_eq_PDA_Class; PDA_FinalStateClass_eq_Class"
      module: "Langlib.Automata.Pushdown"
      status: "proved"
      note: >-
        The unrestricted-grammar CFL definition agrees with Mathlib's CFG
        predicate and with PDA recognition under either acceptance convention.
    - source: "Knuth's LR(k) languages and deterministic pushdown automata"
      lean: "LR_eq_DPDA; LR_eq_DCF"
      module: "Langlib.Grammars.LR.Equivalence"
      status: "proved"
      note: >-
        The canonical LR(k) predicate is stated directly on unrestricted
        grammars, with a proved compatibility characterization through
        CF_grammar. Existential finite-lookahead LR languages coincide with the
        DPDA-defined deterministic context-free class.
    - source: "Myhill-Kuroda characterization"
      lean: "CS_eq_LBA"
      module: "Langlib.Automata.LinearBounded.Equivalence.ContextSensitive"
      status: "proved"
      note: >-
        Context-sensitive grammars with the controlled empty rule recognize
        exactly the languages of finite nondeterministic endmarker LBAs.
    - source: "Unrestricted grammars and Turing machines"
      lean: "TM_eq_RE"
      module: "Langlib.Automata.Turing.Equivalence.RecursivelyEnumerable"
      status: "proved"
      note: >-
        Unrestricted grammar generation agrees with recognition by finite-state,
        finite-work-alphabet Mathlib TM0 machines.
    - source: "Strict extended Chomsky hierarchy"
      lean: >-
        RG_strict_subclass_Linear_of_card;
        Linear_strict_subclass_CF_of_card;
        RG_strict_subclass_DCF_of_card;
        DCF_strict_subclass_CF_of_card;
        Linear_incomp_DPDA_of_card;
        CF_strict_subclass_Indexed; Indexed_strict_subclass_CS;
        CS_strict_subclass_Recursive_of_card;
        Recursive_strict_subclass_RE_of_card
      module: "Langlib.Classes"
      status: "proved"
      note: >-
        The two regular-to-context-free branches and the indexed,
        context-sensitive, recursive, and RE levels are strict over every
        finite alphabet with at least the number of elements stated in
        Challenge.lean. Linear and DPDA-recognizable languages are incomparable
        once the alphabet has at least four elements.
    - source: "Linear languages are not closed under concatenation"
      lean: "Linear_not_closedUnderConcatenation"
      module: "Langlib.Classes.Linear.Closure.Concatenation"
      status: "proved"
      note: >-
        Whenever the terminal alphabet has at least 4 elements, two linear
        languages have a concatenation that is not linear.
    - source: "Classical language-class closure properties"
      lean: "The 91 closure and non-closure declarations listed in comparator.json"
      module: "Langlib.Classes.*.Closure"
      status: "proved"
      note: >-
        For seven classes, the selected declarations cover union, intersection,
        complement, concatenation, star, homomorphism, epsilon-free
        homomorphism, substitution, inverse homomorphism, reversal,
        intersection with regular languages, right quotient, and right quotient
        with a regular language. The README table gives the plain-language
        yes/no account and links each theorem family.

